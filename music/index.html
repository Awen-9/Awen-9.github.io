         （起点压在 -42° 以下，别搭到右铃铛的底沿上） -->
    <path d="M109.4 50.5A53 53 0 01122.7 80.5" fill="none" stroke="rgba(255,206,146,.22)" stroke-width="2.4" stroke-linecap="round"/>

    <!-- 玻璃反光 -->
    <path d="M35 62a45.5 45.5 0 0136-20 45.5 45.5 0 0133 14" fill="none" stroke="url(#pcGlass)" stroke-width="14" stroke-linecap="round" opacity=".5"/>
  </svg>
</div>

    <!-- ============================================================
     桌面唱片机（前景，压在平板前面）
     点一下播放/暂停；播放时黑胶转动、唱臂落到盘面上
     曲名/封面/播放态来自 main.js 派发的 awen:track 事件
     整台机器也能拖着挪位置（双击归位）—— 所以这里不用
     aria-hidden 把整块藏掉，只把纯装饰的子层标上
     ============================================================ -->

<div class="prop prop-vinyl" id="prop-vinyl" role="group"
     aria-label="唱片机，拖动能挪位置，双击放回原处">
  <div class="v-meta" aria-hidden="true">
    <span class="v-dot"></span>
    <span class="v-text">
      <span class="v-title" id="vinyl-title">还没放唱片</span>
      <span class="v-artist" id="vinyl-artist"></span>
    </span>
    
    <span class="v-prog"><i id="vinyl-prog"></i></span>
  </div>

  <button class="v-hero" type="button" id="vinyl-toggle" aria-label="播放或暂停音乐" aria-pressed="false">
    <span class="v-plinth" aria-hidden="true"></span>

    
    <span class="v-led" aria-hidden="true"></span>
    <span class="v-knob" aria-hidden="true"></span>

    <span class="v-disc" id="vinyl-disc" aria-hidden="true">
      <span class="v-sheen"></span>
      <span class="v-label" id="vinyl-label"></span>
      <span class="v-hole"></span>
    </span>

    <!-- 唱臂：viewBox 100×94 跟 .v-hero 的 1:0.94 完全对齐，
         里面的 (84,12) 就是轴心，臂长 37.6 —— 刚好够从轴心够到黑胶的纹槽。
         旋转组只包住臂管+唱头，轴心的两个圆画在组外，所以底座不跟着转。 -->
    <svg class="v-arm" viewBox="0 0 100 94" aria-hidden="true">
      <defs>
        <linearGradient id="vArmG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#e6ebf2"/><stop offset="0.5" stop-color="#aab2be"/><stop offset="1" stop-color="#7d858f"/>
        </linearGradient>
      </defs>
      <g class="v-arm-g">
        <rect x="81.5" y="13" width="5" height="25" rx="2.5" fill="url(#vArmG)"/>
        <path d="M79.8 36h8.4l1.2 8.4h-10.8z" fill="#cfd5de"/>
        <rect x="77.8" y="43.2" width="12.4" height="4.4" rx="1.4" fill="#2f343c"/>
        <circle cx="85" cy="49.6" r="1.5" fill="#a9b1bb"/>
      </g>
      <circle cx="84" cy="12" r="7.6" fill="#3c424b"/>
      <circle cx="84" cy="12" r="4.2" fill="url(#vArmG)"/>
    </svg>
  </button>
</div>

  </div>

</div>
